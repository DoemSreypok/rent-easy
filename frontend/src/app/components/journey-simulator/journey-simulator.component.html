<!-- 1. Tenant Portal Session -->
<app-tenant-portal 
  *ngIf="portalMode() === 'tenant'" 
  (onRequestAuth)="onRequestAuth.emit($event)"
></app-tenant-portal>

<!-- 2. Landlord / Property Owner Portal Session -->
<app-owner-portal 
  *ngIf="portalMode() === 'owner'" 
  (onRequestAuth)="onRequestAuth.emit($event)"
></app-owner-portal>

<!-- 3. Active Tenancy Hub Session -->
<app-active-tenancy 
  *ngIf="portalMode() === 'active-tenancy'" 
  (onRequestAuth)="onRequestAuth.emit($event)"
></app-active-tenancy>
